services:    
  eth-tracker:
    image: kamikazechaser/eth-tracker:celo-old-2
    restart: unless-stopped
    env_file:
      - stack.env
    volumes:
      - custodial-tracker-data:/service/db
    ports:
      - 127.0.0.1:5001:5001
    networks:
      - custodial
  eth-indexer:
    image: ghcr.io/grassrootseconomics/eth-indexer:v2.3.0-stable
    restart: unless-stopped
    depends_on:
          eth-tracker:
            condition: service_started    
    env_file:
      - stack.env
    ports:
      - 127.0.0.1:5002:5002
    networks:
      - custodial
  ussd-data-service:
    image: ghcr.io/grassrootseconomics/ussd-data-service:v1.4.0-beta
    restart: unless-stopped
    depends_on:
      eth-indexer:
        condition: service_started
    env_file:
      - stack.env
    ports:
      - 127.0.0.1:5006:5006
    networks:
      - custodial
  eth-custodial-notify:
    image: ghcr.io/grassrootseconomics/eth-custodial-notify:v1.0.0-beta
    restart: unless-stopped
    depends_on:
      eth-indexer:
        condition: service_started
    env_file:
      - stack.env
    ports:
      - 127.0.0.1:5035:5035
    networks:
      - custodial
  eth-custodial:
    image: ghcr.io/grassrootseconomics/eth-custodial:v1.5.0-beta
    restart: unless-stopped
    depends_on:
      eth-tracker:
        condition: service_started
    env_file:
      - stack.env
    ports:
      - 127.0.0.1:5003:5003
    networks:
      - custodial



volumes:
  custodial-tracker-data:
    driver: local

networks:
  custodial:
    external: true  