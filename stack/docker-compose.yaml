services:    
  eth-tracker:
    image: kamikazechaser/eth-tracker:celo-old-2
    restart: unless-stopped
    env_file:
      - stack.env
    volumes:
      - custodial-tracker-data:/service/db
    ports:
      - 127.0.0.1:5001:5001
    networks:
      - custodial
  eth-indexer:
    image: ghcr.io/grassrootseconomics/eth-indexer:v2.3.0-stable
    restart: unless-stopped
    depends_on:
          eth-tracker:
            condition: service_started    
    env_file:
      - stack.env
    ports:
      - 127.0.0.1:5002:5002
    networks:
      - custodial  

volumes:
  custodial-tracker-data:
    driver: local

networks:
  custodial:
    external: true  